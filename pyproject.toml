[project]
name = "sdrf-audit"
version = "0.1.0"
description = "Audit SDRF proteomics metadata against the deposited data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sdrf-audit = "sdrf_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
